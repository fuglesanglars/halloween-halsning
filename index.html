<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuslig Halloween-hälsning!</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        .card {
            text-align: center;
            background: rgba(20, 20, 20, 0.9);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #ff6600;
            box-shadow: 0 0 20px #ff6600, inset 0 0 10px rgba(255, 102, 0, 0.5);
            max-width: 500px;
            width: 90%;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.02);
        }

        h1 {
            color: #ff6600;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff6600;
            animation: flicker 2s infinite alternate;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #cccccc;
        }

        .pumpkin {
            font-size: 5rem;
            margin: 20px 0;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.2s;
            user-select: none;
        }

        .pumpkin:active {
            transform: scale(1.3) rotate(10deg);
        }

        .footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #888;
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                text-shadow: 0 0 10px #ff6600, 0 0 20px #ff6600;
            }
            20%, 24%, 55% {
                text-shadow: none;
                color: #441b00;
            }
        }

        /* CSS för fladdermössen */
        .bat {
            position: absolute;
            z-index: 1;
            pointer-events: none;
            animation: flyAcross 6s linear forwards;
            line-height: 1;
        }

        @keyframes flyAcross {
            0% {
                left: -60px;
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                left: 105vw;
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Läskig Halloween!</h1>
        <div class="pumpkin" id="pumpkinBtn" title="Klicka på mig om du vågar...">
  <img src="pumpa.png" alt="Pumpa" width="200">
</div>
        <p>Hoppas din kväll blir fylld av lagom mycket skräck, massor av godis och magiska stunder.</p>
        <p id="spookyText"><em>Bus eller godis? 👻</em></p>
        <div class="footer">Kusliga hälsningar från en vän</div>
    </div>

    <script>
        const pumpkin = document.getElementById("pumpkinBtn");
        const text = document.getElementById("spookyText");
        
        const sounds = [
            "Booo! 👻",
            "Muhahaha! 🧙\u200D♀️",
            "Prassel i mörkret... 🕷️",
            "Ge mig godis! 🍬",
            "Hoppas du slipper spindlar i sängen! 🕸️"
        ];

        pumpkin.addEventListener("click", function() {
            const randomMessage = sounds[Math.floor(Math.random() * sounds.length)];
            text.innerHTML = "<strong>" + randomMessage + "</strong>";
            
            // Skapa 3 fladdermöss samtidigt när man klickar på pumpan
            createBat();
            setTimeout(createBat, 200);
            setTimeout(createBat, 400);
        });

        function createBat() {
            const bat = document.createElement("div");
            bat.className = "bat";
            bat.innerText = "🦇";
            
            // SLUMPMÄSSIG STORLEK: Mellan 16px (liten) och 50px (stor)
            const randomSize = Math.floor(Math.random() * 35) + 16;
            bat.style.fontSize = randomSize + "px";
            
            // Slumpmässig starthöjd (mellan 10% och 80% av skärmhöjden)
            bat.style.top = (Math.random() * 70 + 10) + "vh";
            
            // Slumpmässig hastighet baserat på storlek (små fladdermöss ser ut att vara längre bort och flyger lite långsammare)
            const speed = randomSize < 25 ? (Math.random() * 2 + 6) : (Math.random() * 2 + 4);
            bat.style.animationDuration = speed + "s";
            
            document.body.appendChild(bat);

            // Ta bort fladdermusen när den flugit förbi
            setTimeout(function() {
                bat.remove();
            }, speed * 1000);
        }

        // Skapa ett automatiskt flöde av fladdermöss i bakgrunden var 1.5:e sekund
        setInterval(createBat, 1500);

        // Skapa 4 fladdermöss direkt när sidan laddas
        createBat();
        setTimeout(createBat, 400);
        setTimeout(createBat, 800);
        setTimeout(createBat, 1200);
    </script>
</body>
</html>
